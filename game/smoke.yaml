  # Test 180-degree safety lock: try to turn up immediately (while moving down)
  - key: up
  - advance: 150ms
  - shot: should_not_turn_up
  # Steer left
  - key: left
  - advance: 300ms
  - shot: moved_left
  # Pause game
  - rune: ' '
  - advance: 300ms
  - shot: paused

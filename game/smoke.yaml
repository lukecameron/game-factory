seed: 1
seats: 2
heartbeat: 50ms
steps:
  - wake: null
  - shot: start
  # Switch theme from seat 0
  - seat: 0
  - rune: 't'
  - shot: theme_cycled_seat0
  # Switch seat to seat 1 and cycle theme
  - seat: 1
  - rune: 't'
  - shot: theme_cycled_seat1
  # Let them run straight towards each other for 9 ticks (1350ms) to trigger a head-on collision
  - advance: 1350ms
  - shot: game_over_collision
  # Restart game using space key from seat 0
  - seat: 0
  - rune: ' '
  - advance: 150ms
  - shot: restarted
  # Test Player 1 steering Snake 1 down (using rune 's')
  - seat: 0
  - rune: 's'
  # Test Player 2 steering Snake 2 up (using key up)
  - seat: 1
  - key: up
  - advance: 300ms
  - shot: steered_snakes
  # Switch to HAZARDS mode (press 'm')
  - seat: 0
  - rune: 'm'
  - advance: 150ms
  - shot: mode_hazards_start
  # Advance to let hazards move
  - advance: 300ms
  - shot: mode_hazards_moving
  # Switch to MAZE mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_maze_start
  # Advance to let maze hazards move
  - advance: 300ms
  - shot: mode_maze_moving
  # Switch back to CLASSIC mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_classic_returned

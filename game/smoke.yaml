seed: 1
seats: 2
heartbeat: 50ms
steps:
  - wake: null
  - shot: start
  # Switch theme to Neon Ocean (press 't' from seat 0)
  - rune: 't'
  - shot: theme_neon_ocean
  # Switch seat to seat 1
  - seat: 1
  # Press 't' from seat 1 to switch theme to Sunset Glow and trigger seat display update
  - rune: 't'
  - shot: seat_1_active
  # Switch seat back to seat 0
  - seat: 0
  # Press 't' from seat 0 to cycle to Matrix Grid theme
  - rune: 't'
  - shot: seat_0_active
  # Move right 4 ticks to X=23, Y=9
  - advance: 600ms
  - shot: moved_right
  # Turn down and move 6 ticks to X=23, Y=15 to eat food
  - key: down
  - advance: 900ms
  - shot: food_eaten
  # Turn left and move 12 ticks to X=11, Y=15
  - key: left
  - advance: 1800ms
  - shot: before_obstacle_turn
  # Turn up and move 4 ticks to X=11, Y=11 (hits obstacle)
  - key: up
  - advance: 600ms
  - shot: game_over
  # Restart game using space key
  - rune: ' '
  - advance: 150ms
  - shot: restarted
  # Switch to HAZARDS mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_hazards_start
  # Advance to let hazards move
  - advance: 300ms
  - shot: mode_hazards_moving
  # Switch to MAZE mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_maze_start
  # Advance to let hazards move in maze
  - advance: 300ms
  - shot: mode_maze_moving
  # Switch back to CLASSIC mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_classic_returned

seed: 1
seats: 2
heartbeat: 50ms
steps:
  - wake: null
  - shot: start
  # Switch theme from seat 0
  - seat: 0
  - rune: 't'
  - shot: theme_cycled_seat0
  # Switch seat to seat 1 and cycle theme
  - seat: 1
  - rune: 't'
  - shot: theme_cycled_seat1
  # Let them run straight towards each other for 9 ticks (1350ms) to trigger a head-on collision
  - advance: 1350ms
  - shot: game_over_collision
  # Restart game using space key from seat 0
  - seat: 0
  - rune: ' '
  - advance: 150ms
  - shot: restarted
  # Test Player 1 steering Snake 1 down (using rune 's')
  - seat: 0
  - rune: 's'
  # Test Player 2 steering Snake 2 up (using key up)
  - seat: 1
  - key: up
  - advance: 300ms
  - shot: steered_snakes
  # Switch to HAZARDS mode (press 'm')
  - seat: 0
  - rune: 'm'
  - advance: 150ms
  - shot: mode_hazards_start
  # Advance to let hazards move
  - advance: 300ms
  - shot: mode_hazards_moving
  # Switch to MAZE mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_maze_start
  # Advance to let maze hazards move
  - advance: 300ms
  - shot: mode_maze_moving
  # Switch to PORTALS mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_portals_start
  # Steer Snake 2 down to avoid head-on collision
  - seat: 1
  - key: down
  - advance: 150ms
  # Now let Snake 1 run right towards Portal B (at 29,9)
  # Snake 1 starts at 10,9. Moves to 11,9 at first advance. Needs 18 more advances to reach 29,9 (2700ms).
  - advance: 2700ms
  - shot: snake1_at_portal_b
  # Advance 1 more tick to trigger teleportation to Portal A (9,9) and emergence at (10,9)
  - advance: 150ms
  - shot: snake1_teleported
  # Switch to BOMB mode (press 'm')
  - seat: 0
  - rune: 'm'
  - advance: 150ms
  - shot: mode_bomb_start
  # Switch back to CLASSIC mode (press 'm')
  - rune: 'm'
  - advance: 150ms
  - shot: mode_classic_returned

  # --- Test Power-ups ---
  # Steer Snake 2 down to avoid head-on collision
  - seat: 1
  - key: down
  - advance: 600ms
  - seat: 1
  - key: right
  # Move Snake 1 right towards food X-coord (23)
  - advance: 1350ms
  - shot: snake1_aligned_with_food
  # Steer Snake 1 up towards food Y-coord (8)
  - seat: 0
  - rune: 'w'
  - advance: 900ms
  - shot: food_eaten_powerup_spawned

  # --- Test Collecting Shield Power-up ---
  # Steer Snake 2 up to align with shield Y-coord (13)
  - seat: 1
  - key: up
  - advance: 150ms
  - shot: snake2_aligned_with_shield
  # Steer Snake 2 left to eat the shield at X: 2, Y: 13
  - seat: 1
  - key: left
  - advance: 150ms
  - shot: shield_collected
  # Advance one more tick to see active status
  - advance: 150ms
  - shot: shield_active_status

  # --- Test AI Bot functionality ---
  # Enable AI Bot for Snake 2 (rune 'b' from seat 0)
  - seat: 0
  - rune: 'b'
  - shot: bot_enabled_state
  # Advance time by 450ms (3 ticks) to let the bot steer and move Snake 2 automatically
  - advance: 450ms
  - shot: bot_moved_snake2
  # Press arrow key left from seat 1 to manually steer Snake 2 and automatically disable bot
  - seat: 1
  - key: left
  - advance: 150ms
  - shot: bot_manually_disabled

  # --- Test PB Persistency ---
  # Force a collision to trigger Game Over and save the new PB
  - advance: 1200ms
  - shot: pb_game_over_collision
  # Restart game and verify PB is loaded and shown in the header
  - seat: 0
  - rune: ' '
  - advance: 150ms
  - shot: pb_restarted_shows_pb_10

  # --- Test Settings Menu ---
  # Pause the game
  - seat: 0
  - rune: ' '
  - advance: 150ms
  - shot: paused_for_settings
  # Open settings menu
  - rune: 's'
  - advance: 150ms
  - shot: settings_menu_opened
  # Change Snake 1 Skin
  - key: right
  - advance: 150ms
  - shot: settings_snake1_skin_changed
  # Move down to Snake 2 Skin, then Grid Dots
  - rune: 's'
  - rune: 's'
  - advance: 150ms
  - shot: settings_navigated_to_dots
  # Toggle Grid Dots off
  - key: right
  - advance: 150ms
  - shot: settings_dots_toggled
  # Move down to Start Speed
  - rune: 's'
  - advance: 150ms
  - shot: settings_navigated_to_speed
  # Change Start Speed
  - key: left
  - advance: 150ms
  - shot: settings_speed_changed
  # Move down to Audio setting
  - rune: 's'
  - advance: 150ms
  - shot: settings_navigated_to_audio
  # Toggle Audio setting to OFF
  - key: left
  - advance: 150ms
  - shot: settings_audio_toggled
  # Close settings menu
  - rune: ' '
  - advance: 150ms
  - shot: settings_closed
  # Resume gameplay
  - rune: ' '
  - advance: 300ms
  - shot: settings_applied_and_resumed

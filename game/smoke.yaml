seed: 1
seats: 1
heartbeat: 50ms
steps:
  - wake: null
  - shot: start
  - advance: 450ms
  - shot: moved_right
  # Test 180-degree safety lock: try to turn left immediately (while moving right)
  - key: left
  - advance: 150ms
  - shot: should_not_turn_left
  # Steer down
  - key: down
  - advance: 300ms

seed: 1
seats: 1
heartbeat: 50ms
steps:
  - wake: null
  - shot: start
  # Move right 4 ticks to X=23, Y=9
  - advance: 600ms
  - shot: moved_right
  # Turn down and move 6 ticks to X=23, Y=15 to eat food
  - key: down
  - advance: 900ms
  - shot: food_eaten
  # Turn left and move 12 ticks to X=11, Y=15
  - key: left
  - advance: 1800ms
  - shot: before_obstacle_turn
  # Turn up and move 4 ticks to X=11, Y=11 (hits obstacle)
  - key: up
  - advance: 600ms
  - shot: game_over
  # Restart game using space key
  - rune: ' '
  - advance: 150ms
  - shot: restarted
